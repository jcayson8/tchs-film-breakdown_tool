<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TCHS Football Film Breakdown Tool</title>
  <style>
    :root{--navy:#002147;--orange:#FF6B00;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{display:flex;height:100vh;background:#F6F7FA}
    .sidebar{width:240px;background:var(--navy);color:#fff;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:24px}
    .sidebar img{height:64px;margin-bottom:32px}
    .sidebar ul{list-style:none;width:100%}
    .sidebar li{padding:16px;cursor:pointer;transition:.2s;text-align:left}
    .sidebar li.active,.sidebar li:hover{background:rgba(255,255,255,0.1)}
    .main{flex:1;padding:32px;overflow-y:auto}
    h1{color:var(--navy);margin-bottom:24px;font-size:32px}
    .upload-box{border:2px dashed #ccc;border-radius:8px;padding:40px;text-align:center;background:#fff;cursor:pointer;transition:.2s}
    .upload-box.drag{border-color:var(--orange)}
    .file-list{margin-top:16px}
    .file-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #ddd;border-radius:4px;padding:8px;margin-bottom:8px}
    .progress-container{width:60%}
    .progress-bar{height:8px;background:var(--orange);width:0;border-radius:4px;transition:width .3s}
    .progress-bg{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:4px}
    table{width:100%;border-collapse:collapse;margin-top:16px}
    th,td{border:1px solid #ddd;padding:8px;text-align:left}
    th{background:var(--navy);color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;margin-top:24px}
    .card{background:#fff;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.08);padding:24px}
    .card h2{font-size:18px;color:var(--navy);margin-bottom:12px}
    .row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:16px}
    .row .v{color:var(--orange);font-weight:600}
    .hidden{display:none}
  </style>
</head>
<body>
  <aside class="sidebar">
    <img src="Logo.PNG" alt="TC Bulldogs"/>
    <ul>
      <li class="active" data-tab="upload">Upload Clips</li>
      <li data-tab="play">Play Table</li>
      <li data-tab="offense">Offense</li>
      <li data-tab="defense">Defense</li>
    </ul>
  </aside>
  <main class="main">
    <section id="upload">
      <h1>Upload Clips</h1>
      <div id="uBox" class="upload-box">Drag &amp; drop MP4 files or click to select</div>
      <input id="fileInput" type="file" accept=".mp4" multiple hidden/>
      <div id="fileList" class="file-list"></div>
    </section>
    <section id="play" class="hidden">
      <h1>Play Table</h1>
      <table id="playTable"></table>
    </section>
    <section id="offense" class="hidden">
      <h1>Offense</h1>
      <div class="grid">
        <div class="card">
          <h2>Offensive Formation %</h2>
          <div class="row"><span>Spread</span><span class="v" id="ofSpread">—</span></div>
          <div class="row"><span>I-Formation</span><span class="v" id="ofIForm">—</span></div>
          <div class="row"><span>Trio Right</span><span class="v" id="ofTrioRt">—</span></div>
          <div class="row"><span>Trio Left</span><span class="v" id="ofTrioLt">—</span></div>
        </div>
      </div>
    </section>
    <section id="defense" class="hidden">
      <h1>Defense</h1>
      <div class="grid">
        <div class="card">
          <h2>Defensive Formation %</h2>
          <div class="row"><span>4-3</span><span class="v" id="df43">—</span></div>
          <div class="row"><span>3-3</span><span class="v" id="df33">—</span></div>
          <div class="row"><span>Nickel</span><span class="v" id="dfNickel">—</span></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    // Tab navigation
    document.querySelectorAll('.sidebar li').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.sidebar li').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('main>section').forEach(s => s.classList.add('hidden'));
        document.getElementById(tab.dataset.tab).classList.remove('hidden');
      };
    });

    // Upload & drag-and-drop
    const uBox = document.getElementById('uBox');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    uBox.onclick = () => fileInput.click();
    ['dragenter','dragover'].forEach(e => uBox.addEventListener(e, ev => { ev.preventDefault(); uBox.classList.add('drag'); }));
    ['dragleave','drop'].forEach(e => uBox.addEventListener(e, ev => { ev.preventDefault(); uBox.classList.remove('drag'); }));
    uBox.addEventListener('drop', ev => handleFiles(ev.dataTransfer.files));
    fileInput.addEventListener('change', ev => handleFiles(ev.target.files));

    function handleFiles(files) {
      Array.from(files).forEach(file => {
        const row = document.createElement('div'); row.className='file-row';
        row.innerHTML = `
          <span>${file.name}</span>
          <div class="progress-container">
            <div class="progress-bg"><div class="progress-bar"></div></div>
          </div>`;
        fileList.appendChild(row);
        const bar = row.querySelector('.progress-bar');
        const form = new FormData(); form.append('files', file);
        fetch('/api/upload',{ method:'POST', body: form })
          .then(r => r.json())
          .then(() => {
            let pct=0; const iv=setInterval(()=>{
              pct+=10; bar.style.width=pct+'%';
              if(pct>=100) clearInterval(iv);
            },300);
          });
      });
    }

    // Load plays
    async function loadPlays(){
      const res = await fetch('/api/plays');
      const plays = await res.json();
      const table = document.getElementById('playTable');
      table.innerHTML = '<tr><th>ID</th><th>Team</th><th>Off Form</th><th>Def Form</th><th>Blitz</th><th>Coverage</th><th>Run Dir</th><th>Pass</th><th>Comp</th></tr>'
        + plays.map(p => `
          <tr>
            <td>${p.id}</td><td>${p.team}</td>
            <td>${p.offense_formation}</td><td>${p.defense_formation}</td>
            <td>${p.blitz}</td><td>${p.coverage}</td>
            <td>${p.run_direction}</td><td>${p.pass_type}</td>
            <td>${p.completed}</td>
          </tr>`).join('');
    }

    // Load metrics
    async function loadMetrics(){
      const res = await fetch('/api/metrics');
      const { formations, defense } = await res.json();
      formations.forEach(f => {
        const m = { 'Spread':'ofSpread','I-Formation':'ofIForm','Trio Right':'ofTrioRt','Trio Left':'ofTrioLt' };
        document.getElementById(m[f.category]).textContent = f.pct.toFixed(1) + '%';
      });
      defense.forEach(d => {
        const m = { '4-3':'df43','3-3':'df33','Nickel':'dfNickel' };
        document.getElementById(m[d.category]).textContent = d.pct.toFixed(1) + '%';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPlays();
      loadMetrics();
    });
  </script>
</body>
</html>
