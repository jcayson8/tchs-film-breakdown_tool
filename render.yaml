
3. Commit the change.

---

### 2) Trigger a fresh install on Render

1. Go to your **tchs-film-worker** (or web service if you install there) in Render.  
2. Click **Manual Deploy → Clear cache & deploy**.  
3. During the build you’ll see `npm install` pull in chokidar alongside your other packages.

---

That’s it—once Render rebuilds, your `worker.js` import of chokidar will resolve and your watcher will run as expected.

> **Locally** (if you ever do want to test on your machine), you can run:
> ```bash
> cd backend
> npm install chokidar
> ```
> but it’s not required for your Render deployment.
