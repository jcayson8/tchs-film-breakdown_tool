# render.yaml — drops the entire app, worker, disk & database in one go
services:
  - type: web_service
    name: tchs-film-prod
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    startCommand: node backend/server.js
    diskMounts:
      - diskName: media-disk
        mountPath: /data

  - type: background_worker
    name: tchs-film-worker
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    startCommand: node backend/worker.js
    diskMounts:
      - diskName: media-disk
        mountPath: /data

databases:
  - name: tchs-film-db
    plan: starter

disks:
  - name: media-disk
    sizeGB: 50
